[workspace]
resolver = "2"
members = [
    "crates/shirabe-dsp",
    "crates/shirabe-ui",
    "crates/shirabe-plugin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["The Shirabe contributors"]
repository = "https://github.com/My-MC/shirabe"

[workspace.dependencies]
# nih-plug is not published on crates.io. We use the My-MC fork (branch `shirabe`), which adds
# fixes for editor and CLAP state robustness; pin an exact commit so builds are reproducible.
nih_plug = { git = "https://github.com/My-MC/nih-plug.git", rev = "c75fdeac5cc0c853ff7769fb21d5c7d44b090c86" }
nih_plug_egui = { git = "https://github.com/My-MC/nih-plug.git", rev = "c75fdeac5cc0c853ff7769fb21d5c7d44b090c86" }
nih_plug_xtask = { git = "https://github.com/My-MC/nih-plug.git", rev = "c75fdeac5cc0c853ff7769fb21d5c7d44b090c86" }

shirabe-dsp = { path = "crates/shirabe-dsp" }
shirabe-ui = { path = "crates/shirabe-ui" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
