[package]
name = "shirabe-dsp"
description = "Real-time audio measurement primitives for the Shirabe meter suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
keywords = ["audio", "dsp", "meter", "loudness"]
categories = ["multimedia::audio"]

# This crate must stay independent of any plugin framework or GUI toolkit.
[dependencies]

[dev-dependencies]
# Independent reference implementation, only used to cross-check our results in tests.
ebur128 = "0.1.11"
# Reads the official EBU test set in the opt-in conformance test (not redistributed).
hound = "3.5"
