[package]
name = "shirabe-app"
description = "Shirabe Meter Suite: standalone application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "shirabe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Same source as nih-plug's `assert_process_allocs` allocator: debug builds abort when the
# audio callback allocates.
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid", features = ["backtrace", "log"] }
claxon = "0.4"
cpal = "0.15"
# Must use the same egui version as nih_plug_egui (the shared editor code).
hound = "3.5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
nih_plug.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shirabe-dsp.workspace = true
shirabe-plugin = { path = "../shirabe-plugin" }
shirabe-ui.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Loads the PulseAudio client libraries at run time (also served by PipeWire).
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
