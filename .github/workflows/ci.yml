name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build macOS (uses 10x Actions minutes on private repositories)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev
    libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
  BUNDLE_NAME: Shirabe Meter Suite

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  bundle:
    name: bundle (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            exe: shirabe.exe
          - name: linux-x64
            os: ubuntu-22.04
            exe: shirabe
          - name: macos-arm64
            os: macos-14
            exe: shirabe
            macos: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Decide whether this runner is needed
        id: gate
        shell: bash
        run: |
          run=true
          if [[ "${{ matrix.macos }}" == "true" ]]; then
            run=false
            if [[ "${{ github.ref_type }}" == "tag" || "${{ inputs.macos }}" == "true" ]]; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - name: Install Linux build dependencies
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS xvfb
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          key: ${{ matrix.name }}
      - name: Bundle VST3 and CLAP
        if: steps.gate.outputs.run == 'true'
        run: cargo xtask bundle shirabe-plugin --release
      - name: Build the standalone application
        if: steps.gate.outputs.run == 'true'
        run: cargo build --release -p shirabe-plugin --bin shirabe
      - name: Validate the VST3 with pluginval (Windows)
        if: steps.gate.outputs.run == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --skip-gui-tests --validate "target/bundled/$env:BUNDLE_NAME.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate the VST3 with pluginval (Linux)
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          python3 -m zipfile -e pluginval.zip pluginval
          chmod +x pluginval/pluginval
          xvfb-run -a pluginval/pluginval --strictness-level 5 --skip-gui-tests --validate "target/bundled/$BUNDLE_NAME.vst3"
      - name: Collect artifacts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          dist="dist/shirabe-${{ matrix.name }}"
          mkdir -p "$dist"
          cp -R "target/bundled/$BUNDLE_NAME.vst3" "$dist/"
          cp -R "target/bundled/$BUNDLE_NAME.clap" "$dist/"
          cp "target/release/${{ matrix.exe }}" "$dist/"
          cp README.md CHANGELOG.md "$dist/"
          cp -R LICENSES "$dist/"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: shirabe-${{ matrix.name }}
          path: dist/
          retention-days: 14
